name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, asset: agent-macos-aarch64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, asset: agent-macos-x86_64 }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: agent-linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: agent-linux-aarch64 }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, asset: agent-windows-x86_64.exe }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        run: test "${GITHUB_REF_NAME#v}" = "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Build
        env:
          AGENT_RELEASE: "1"
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/agent${{ runner.os == 'Windows' && '.exe' || '' }} ${{ matrix.asset }}
      - if: matrix.target != 'x86_64-apple-darwin'
        run: ./${{ matrix.asset }} --version
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: source/${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A semver pre-release tag (v0.3.0-beta.1) must stay off the latest channel.
        run: |
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "$GITHUB_REF_NAME" agent-* --repo "$GITHUB_REPOSITORY" --generate-notes $prerelease
