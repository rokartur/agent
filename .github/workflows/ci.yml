name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these checks before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Its own job, so clippy's 10 s run beside the tests instead of before them.
  lint:
    # release.yml checks the release commit through its tag, so the push of that commit to main would check it twice.
    if: ${{ !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release):')) }}
    timeout-minutes: 15
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: source
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    if: ${{ !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release):')) }}
    timeout-minutes: 15
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # Tests run rg, fd and ImageMagick's convert; Ubuntu ships fd as fdfind.
      - if: runner.os == 'Linux'
        id: image
        run: . /etc/os-release && echo "version=$ID-$VERSION_ID-$(dpkg --print-architecture)-$(dpkg-query -W 'libmagick*' | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      # The Azure apt mirror sometimes serves these 3.5 MB at 40 kB/s (105 s on a miss). imagemagick needs the image's libmagick at its exact version,
      # so the key follows those packages alone: a hash of every package changed with each runner image and missed.
      - if: runner.os == 'Linux'
        id: debs
        uses: actions/cache@v6
        with:
          path: ~/debs
          key: debs-${{ steps.image.outputs.version }}-ripgrep-fd-find-imagemagick
      - if: runner.os == 'Linux' && steps.debs.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends --download-only ripgrep fd-find imagemagick && mkdir -p ~/debs && cp /var/cache/apt/archives/*.deb ~/debs
      # Debs cached on another image can miss a dependency this one lacks; apt then fetches what is missing.
      - if: runner.os == 'Linux'
        run: |
          if ! sudo dpkg -i ~/debs/*.deb; then
            echo "::warning::cached debs did not install, installing from apt"
            sudo apt-get update && sudo apt-get install -y --no-install-recommends --fix-broken
          fi
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd
      # Release tarballs, as brew install took 7-11 s; macos-latest is arm64.
      - if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO --retry 3 https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-aarch64-apple-darwin.tar.gz
          curl -fsSLO --retry 3 https://github.com/sharkdp/fd/releases/download/v10.5.1/fd-v10.5.1-aarch64-apple-darwin.tar.gz
          shasum -a 256 -c <<'EOF'
          3750b2e93f37e0c692657da574d7019a101c0084da05a790c83fd335bad973e4  ripgrep-15.2.0-aarch64-apple-darwin.tar.gz
          2d336895ed27b14c5cc9fc5eb22df03b3ee842b5dce80060e99d9cdc1b1b9fc7  fd-v10.5.1-aarch64-apple-darwin.tar.gz
          EOF
          mkdir bin
          tar xzf ripgrep-15.2.0-aarch64-apple-darwin.tar.gz -C bin --strip-components=1 ripgrep-15.2.0-aarch64-apple-darwin/rg
          tar xzf fd-v10.5.1-aarch64-apple-darwin.tar.gz -C bin --strip-components=1 fd-v10.5.1-aarch64-apple-darwin/fd
          echo "$PWD/bin" >> "$GITHUB_PATH"
      # choco puts rg and fd shims on PATH; ImageMagick's installer changes PATH only for later shells.
      - if: runner.os == 'Windows'
        run: |
          choco install -y --no-progress ripgrep --version 15.2.0
          choco install -y --no-progress fd --version 10.5.2
          choco install -y --no-progress imagemagick.app --version 7.1.2.2500
          cygpath -w "/c/Program Files"/ImageMagick-* >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: source
      - run: cargo test --locked --no-run
      # cargo test runs its binaries one after another, and both mostly wait on child processes: run them side by side.
      - run: |
          kinds=$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].targets[].kind[]] | unique | join(" ")')
          if [ "$kinds" != "bin test" ]; then
            echo "::error::--bins and --test '*' miss targets of kind: $kinds"
            exit 1
          fi
          cargo test --locked --test '*' > "$RUNNER_TEMP/integration.log" 2>&1 &
          integration=$!
          units=0; cargo test --locked --bins || units=$?
          status=0; wait "$integration" || status=$?
          cat "$RUNNER_TEMP/integration.log"
          exit $((units || status))
