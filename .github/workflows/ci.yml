name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v7
      # Tests run rg and fd; Ubuntu ships fd as fdfind.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep fd-find && sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd
      - if: runner.os == 'macOS'
        run: brew install ripgrep fd
      - run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
