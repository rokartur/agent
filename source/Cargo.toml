[package]
name = "agent"
version = "0.1.38"
edition = "2024"
description = "A coding agent in one Rust binary"
license = "GPL-3.0-or-later"
repository = "https://github.com/rokartur/agent"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
ring = "0.17"
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
serde_json = "1"
unicode-width = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls", "socks-proxy"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
